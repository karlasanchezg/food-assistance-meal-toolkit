<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEAL Readiness Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one centered working column; intro, then one dimension per step, then a results profile. */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --fg:#1c2a26; --muted:#5b6b66; --line:#d7dfda;
  --accent:#2e6a4f; --accent-soft:#e3efe8; --grain:#b97b22;
  --t1:#c2552f; --t2:#c9952a; --t3:#2e6a4f;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a18; --surface:#1a2522; --fg:#e6ece9; --muted:#9aaba5; --line:#2c3a36;
  --accent:#6cc09a; --accent-soft:#1f352c; --grain:#e0a94e;
  --t1:#e07a55; --t2:#e2b453; --t3:#6cc09a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121a18; --surface:#1a2522; --fg:#e6ece9; --muted:#9aaba5; --line:#2c3a36;
  --accent:#6cc09a; --accent-soft:#1f352c; --grain:#e0a94e;
  --t1:#e07a55; --t2:#e2b453; --t3:#6cc09a; color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font:600 .85rem var(--body);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0}
p{margin:0}
.lede{font-size:1.08rem;color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:16px}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;list-style:none;margin:0;padding:0}
.dims li{display:flex;gap:10px;align-items:baseline;font-size:.95rem}
.dims b{font-family:var(--display);color:var(--grain);min-width:1.2em}
.tiers{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft)}
.dot{width:9px;height:9px;border-radius:50%}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600;min-width:0}
input[type=text],select{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 .95rem var(--body);padding:11px 20px;border-radius:8px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--grain);outline-offset:2px}
.note{font-size:.85rem;color:var(--muted)}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.steps span{height:6px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--accent)}
.steps span.now{background:var(--grain)}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--grain)}
.q{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q legend{font-weight:600;padding:0;margin-bottom:4px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* results */
.overall{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--display);font-weight:700;font-size:1.3rem;padding:8px 16px;border-radius:8px;color:var(--bg)}
.chart{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:minmax(0,190px) 1fr 92px;gap:12px;align-items:center;font-size:.92rem}
.track{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line) 0 50%,transparent 50%);background-color:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar{position:absolute;inset:0 auto 0 0;border-radius:7px}
.lv{font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.axis{display:grid;grid-template-columns:minmax(0,190px) 1fr 92px;gap:12px;font-size:.75rem;color:var(--muted)}
.axis div:nth-child(2){display:flex;justify-content:space-between}
.recs{display:flex;flex-direction:column;gap:14px}
.rec{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-left:4px solid var(--line);background:var(--bg);border-radius:0 8px 8px 0}
.rec ul{margin:0;padding-left:20px}
.priority{border:2px solid var(--grain)}
.sample{font-size:.8rem;font-weight:600;color:var(--grain)}
footer{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:18px}
footer a{color:var(--accent)}
cite{font-style:normal;user-select:all}
@media (max-width:560px){
  .fields{grid-template-columns:1fr}
  .row,.axis{grid-template-columns:minmax(0,1fr) 84px}
  .row .track{grid-column:1/-1;order:3}
  .axis{display:none}
}
@media (prefers-reduced-motion:no-preference){.bar{transition:width .6s ease}}
</style>

</head>

   {en:"Can you break down your numbers by group or area?",es:"¿Puede desagregar sus números por grupo o zona?",
    o:[["No","No"],["Only with a lot of manual work","Solo con mucho trabajo manual"],["For some indicators","Para algunos indicadores"],["Routinely","De forma rutinaria"]]},
   {en:"Do you know which groups in your area are not reaching your services?",es:"¿Sabe qué grupos de su zona no están llegando a sus servicios?",
    o:[["No","No"],["We have assumptions","Tenemos suposiciones"],["We have some evidence","Tenemos algo de evidencia"],["Yes, analyzed with outside data such as census or need maps","Sí, analizado con datos externos como censo o mapas de necesidad"]]},
   {en:"Have you adjusted services to reach underserved groups (hours, location, language)?",es:"¿Ha ajustado los servicios para llegar a grupos desatendidos (horarios, lugar, idioma)?",
    o:[["No","No"],["We have discussed it","Lo hemos conversado"],["Once","Una vez"],["Regularly, based on data","Con regularidad, según los datos"]]}],
  r:[
   {en:["Add two or three questions to intake: household size, children and seniors, ZIP code.","Explain why you ask and that answers are optional.","Count your households by ZIP code once a quarter."],
    es:["Agregue dos o tres preguntas al registro: tamaño del hogar, niños y adultos mayores, código postal.","Explique por qué pregunta y que las respuestas son opcionales.","Cuente sus hogares por código postal una vez al trimestre."]},
   {en:["Disaggregate your core indicators by household type and area.","Compare who you serve with local need data, such as census or food bank maps.","Pick one underserved group and test one change, such as evening hours."],
    es:["Desagregue sus indicadores principales por tipo de hogar y zona.","Compare a quién atiende con datos de necesidad local, como el censo o mapas del banco de alimentos.","Elija un grupo desatendido y pruebe un cambio, como un horario nocturno."]},
   {en:["Review reach gaps in every learning review.","Track whether adjustments increased participation from the target group.","Share reach analysis with partners to coordinate coverage."],
    es:["Revise las brechas de alcance en cada revisión de aprendizaje.","Mida si los ajustes aumentaron la participación del grupo meta.","Comparta el análisis de alcance con aliados para coordinar la cobertura."]}]},
 {en:"Food security as context",es:"Seguridad alimentaria como contexto",
  ien:"Whether you understand participants' situation and experience, with care for privacy.",ies:"Si comprende la situación y experiencia de los participantes, cuidando su privacidad.",
  q:[
   {en:"Do you ever measure participants' food security?",es:"¿Alguna vez mide la seguridad alimentaria de los participantes?",
    o:[["Never","Nunca"],["Only through stories or anecdotes","Solo con historias o anécdotas"],["Once, or occasionally","Una vez, u ocasionalmente"],["Periodically, with a validated tool such as the USDA module or Hunger Vital Sign","Periódicamente, con una herramienta validada como el módulo de USDA o Hunger Vital Sign"]]},
   {en:"Do you ask participants about their satisfaction with the quality, quantity and cultural fit of the food?",es:"¿Pregunta a los participantes por su satisfacción con la calidad, cantidad y pertinencia cultural de los alimentos?",
    o:[["No","No"],["Informally","De manera informal"],["Through an occasional survey","Con una encuesta ocasional"],["Through a regular survey","Con una encuesta regular"]]},
   {en:"How do you handle consent and data protection?",es:"¿Cómo maneja el consentimiento y la protección de datos?",
    o:[["No procedures","Sin procedimientos"],["Verbal and informal","Verbal e informal"],["Consent is obtained and data has some protection","Se obtiene consentimiento y los datos tienen alguna protección"],["Written procedure, secure storage and limited access","Procedimiento escrito, almacenamiento seguro y acceso limitado"]]},
   {en:"Is this information used for decisions, such as food mix or referrals?",es:"¿Esta información se usa para decidir, por ejemplo la mezcla de alimentos o las referencias?",
    o:[["No","No"],["Rarely","Rara vez"],["Sometimes","A veces"],["Regularly","Con regularidad"]]}],
  r:[
   {en:["Write a short consent script and a rule for where participant data is stored and who can see it.","Start with three satisfaction questions on quality, quantity and cultural fit.","Never make answering a condition for receiving food."],
    es:["Escriba un guion corto de consentimiento y una regla sobre dónde se guardan los datos y quién los ve.","Empiece con tres preguntas de satisfacción sobre calidad, cantidad y pertinencia cultural.","Nunca condicione la ayuda a que respondan."]},
   {en:["Run a short participant survey twice a year with a small sample.","Consider the two-question Hunger Vital Sign at intake or in the survey.","Bring survey results to your learning reviews."],
    es:["Aplique una encuesta corta a una pequeña muestra dos veces al año.","Considere las dos preguntas del Hunger Vital Sign en el registro o la encuesta.","Lleve los resultados de la encuesta a sus revisiones de aprendizaje."]},
   {en:["Track food security at selected sites with the USDA six-item module.","Use the results as context for decisions, not as proof of impact.","Partner with a university if you want to test which service models work best."],
    es:["Mida la seguridad alimentaria en sitios seleccionados con el módulo de seis preguntas de USDA.","Use los resultados como contexto para decidir, no como prueba de impacto.","Alíese con una universidad si quiere probar qué modelos de servicio funcionan mejor."]}]}
];

const SAMPLE = [[2,1,1,1],[1,1,0,1],[1,0,1,2],[1,1,1,0],[2,1,0,1],[0,1,1,1]];
const KEY="meal-check-v1";
let S = {lang:"en",screen:"intro",step:0,answers:D.map(d=>d.q.map(()=>null)),org:"",type:0,sample:false};

function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.answers&&s.answers.length===D.length)S=Object.assign(S,s);const l=localStorage.getItem("fam-lang");if(l==="en"||l==="es")S.lang=l;}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem("fam-lang",S.lang);}catch(e){}}
const t=k=>T[S.lang][k];
const L=o=>o[S.lang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dimScore(i){const a=S.answers[i];return a.reduce((s,v)=>s+(v??0),0)/a.length;}
function level(sc){return sc<1.5?0:sc<2.5?1:2;}
const tierColor=l=>["var(--t1)","var(--t2)","var(--t3)"][l];
function complete(i){return S.answers[i].every(v=>v!==null);}
function anyStarted(){return S.answers.some(a=>a.some(v=>v!==null));}

function staticText(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.getElementById("lang-en").setAttribute("aria-pressed",S.lang==="en");
  document.getElementById("lang-es").setAttribute("aria-pressed",S.lang==="es");
  document.getElementById("cite").textContent = S.lang==="en"
    ? "Sanchez, K. M. (2026). Food Assistance MEAL Toolkit: MEAL Readiness Check (Version "+VERSION+")."
    : "Sanchez, K. M. (2026). Food Assistance MEAL Toolkit: Diagnóstico de Capacidad MEAL (Versión "+VERSION+").";
}

function intro(){
  return `<section style="display:flex;flex-direction:column;gap:20px">
    <h1>${t("title")}</h1>
    <p class="lede">${t("lede")}</p>
    <div class="panel">
      <h3>${t("covers")}</h3>
      <ul class="dims">${D.map((d,i)=>`<li><b>${i+1}</b><span><strong>${esc(L(d))}</strong><br><span class="note">${esc(S.lang==="en"?d.ien:d.ies)}</span></span></li>`).join("")}</ul>
      <h3>${t("tiersLbl")}</h3>
      <div class="tiers">${[0,1,2].map(l=>`<span class="chip"><span class="dot" style="background:${tierColor(l)}"></span>${t("levels")[l]}: ${t("levelDesc")[l]}</span>`).join("")}</div>
    </div>
    <div class="panel">
      <div class="fields">
        <label class="f" for="org">${t("orgname")}<input type="text" id="org" value="${esc(S.org)}" autocomplete="organization"></label>
        <label class="f" for="otype">${t("orgtype")}<select id="otype">${t("types").map((o,i)=>`<option value="${i}" ${i==S.type?"selected":""}>${o}</option>`).join("")}</select></label>
      </div>
      <div class="actions">
        <button class="btn" id="go">${anyStarted()&&!S.sample?t("resume"):t("start")}</button>
        <button class="btn ghost" id="demo">${t("sample")}</button>
      </div>
    </div></section>`;
}

function stepView(){
  const i=S.step,d=D[i];
  return `<section class="panel">
    <div class="steps" aria-hidden="true">${D.map((_,k)=>`<span class="${k<i?"done":k===i?"now":""}"></span>`).join("")}</div>
    <p class="eyebrow">${t("step")} ${i+1} ${t("of")} ${D.length}</p>
    <h2>${esc(L(d))}</h2>
    <p class="note">${esc(S.lang==="en"?d.ien:d.ies)}</p>
    ${d.q.map((q,qi)=>`<fieldset class="q"><legend>${qi+1}. ${esc(L(q))}</legend><div class="opts">
      ${q.o.map((o,oi)=>`<label class="opt" for="q${i}-${qi}-${oi}"><input type="radio" id="q${i}-${qi}-${oi}" name="q${i}-${qi}" value="${oi}" ${S.answers[i][qi]===oi?"checked":""}><span>${esc(o[S.lang==="en"?0:1])}</span></label>`).join("")}
    </div></fieldset>`).join("")}
    <p class="note" id="hint" ${complete(i)?"hidden":""}>${t("answerAll")}</p>
    <div class="actions">
      <button class="btn ghost" id="back">${t("back")}</button>
      <button class="btn" id="next" ${complete(i)?"":"disabled"}>${i===D.length-1?t("finish"):t("next")}</button>
    </div></section>`;
}

function summaryText(){
  const lines=[t("appname")+(S.org?" | "+S.org:""),""];
  const ov=level(D.reduce((s,_,i)=>s+dimScore(i),0)/D.length);
  lines.push(t("overall")+": "+t("levels")[ov]);
  D.forEach((d,i)=>lines.push(L(d)+": "+t("levels")[level(dimScore(i))]+" ("+dimScore(i).toFixed(1)+"/3)"));
  lines.push("",document.getElementById("cite").textContent);
  return lines.join("\n");
}

function results(){
  const scores=D.map((_,i)=>dimScore(i));
  const avg=scores.reduce((a,b)=>a+b,0)/scores.length, ov=level(avg);
  const pri=scores.indexOf(Math.min(...scores));
  const typeName=S.type>0?t("types")[S.type]:"";
  return `<section style="display:flex;flex-direction:column;gap:20px">
    ${S.sample?`<p class="sample">${t("sampleTag")}</p>`:""}
    <h1>${t("resTitle")}</h1>
    ${S.org||typeName?`<p class="lede">${esc([S.org,typeName].filter(Boolean).join(" · "))}</p>`:""}
    <div class="panel">
      <div class="overall"><span class="note">${t("overall")}</span><span class="badge" style="background:${tierColor(ov)}">${t("levels")[ov]}</span><span class="note">${t("levelDesc")[ov]}</span></div>
      <h3>${t("profile")}</h3>
      <div class="chart" role="img" aria-label="${t("profile")}">
        <div class="axis"><div></div><div><span>0</span><span>1.5</span><span>2.5</span><span>3</span></div><div></div></div>
        ${D.map((d,i)=>{const l=level(scores[i]);return `<div class="row"><span>${esc(L(d))}</span><div class="track"><div class="bar" style="width:${(scores[i]/3*100).toFixed(0)}%;background:${tierColor(l)}"></div></div><span class="lv" style="color:${tierColor(l)}">${t("levels")[l]} ${scores[i].toFixed(1)}</span></div>`}).join("")}
      </div>
    </div>
    <h2>${t("recsTitle")}</h2>
    <div class="recs">
      ${[pri,...D.map((_,i)=>i).filter(i=>i!==pri)].map(i=>{const l=level(scores[i]);const r=D[i].r[l][S.lang];
        return `<div class="rec ${i===pri?"priority":""}" style="border-left-color:${tierColor(l)}">
          ${i===pri?`<span class="eyebrow">${t("first")}</span>`:""}
          <h3>${esc(L(D[i]))}: ${t("levels")[l]}</h3>
          ${i===pri?`<p class="note">${t("firstNote")}</p>`:""}
          <ul>${r.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}).join("")}
    </div>
    <div class="actions">
      <button class="btn" id="copy">${t("copy")}</button>
      <button class="btn ghost" id="edit">${t("edit")}</button>
      <button class="btn ghost" id="restart">${t("restart")}</button>
      <span class="note" id="copymsg" role="status"></span>
    </div>
    <pre id="sumtext" class="note" hidden style="white-space:pre-wrap;user-select:all"></pre>
  </section>`;
}

function render(){
  staticText();
  const v=document.getElementById("view");
  v.innerHTML = S.screen==="intro"?intro():S.screen==="step"?stepView():results();
  bind(); save();
}

function bind(){
  const $=id=>document.getElementById(id);
  if(S.screen==="intro"){
    $("org").addEventListener("input",e=>{S.org=e.target.value;save();});
    $("otype").addEventListener("change",e=>{S.type=+e.target.value;save();});
    $("go").onclick=()=>{if(S.sample){S.answers=D.map(d=>d.q.map(()=>null));S.sample=false;}
      const f=S.answers.findIndex(a=>a.some(v=>v===null));S.step=f<0?0:f;S.screen="step";render();scrollTo(0,0);};
    $("demo").onclick=()=>{S.answers=SAMPLE.map(a=>a.slice());S.sample=true;S.screen="results";render();scrollTo(0,0);};
  } else if(S.screen==="step"){
    document.querySelectorAll('#view input[type=radio]').forEach(r=>r.addEventListener("change",e=>{
      const [,i,qi]=e.target.name.match(/q(\d+)-(\d+)/);S.answers[+i][+qi]=+e.target.value;S.sample=false;save();
      const ok=complete(S.step);$("next").disabled=!ok;$("hint").hidden=ok;}));
    $("back").onclick=()=>{if(S.step===0)S.screen="intro";else S.step--;render();scrollTo(0,0);};
    $("next").onclick=()=>{if(S.step===D.length-1)S.screen="results";else S.step++;render();scrollTo(0,0);};
  } else {
    $("copy").onclick=()=>{const txt=summaryText();const msg=$("copymsg");
      try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent=t("copied");},()=>{msg.textContent=t("copyFail");$("sumtext").textContent=txt;$("sumtext").hidden=false;});}
      catch(e){msg.textContent=t("copyFail");$("sumtext").textContent=txt;$("sumtext").hidden=false;}};
    $("edit").onclick=()=>{if(S.sample){S.answers=D.map(d=>d.q.map(()=>null));S.sample=false;}S.step=0;S.screen="step";render();scrollTo(0,0);};
    $("restart").onclick=()=>{S.answers=D.map(d=>d.q.map(()=>null));S.sample=false;S.step=0;S.screen="intro";render();scrollTo(0,0);};
  }
}

document.getElementById("lang-en").onclick=()=>{S.lang="en";render();};
document.getElementById("lang-es").onclick=()=>{S.lang="es";render();};
load(); render();
</script>
</body>
</html>
